{% extends "index.html" %}
{% block content %}
<section id="view-formularios" class="view-panel">
    <div class="subhead-toolbar">
        <div class="subhead-title">Nueva Compra / Registro de Formulario</div>
    </div>

    <div class="form-container">
        <div class="card">
            <div class="card-title">Cargar Factura</div>
            <form id="invoice-upload-form" action="{{ url_for('upload_invoice') }}" method="post" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Código de Factura <span class="required">*</span></label>
                        <input type="file" name="file" class="form-control">
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Cargar Factura</button>
                    <button type="button" class="btn btn-secondary">Cancelar</button>
                </div>
                <p id="upload-status" role="status" aria-live="polite"></p>
            </form>
        </div>
        <div class="card">
            <div class="card-title">Informacion Factura Compra</div>
            <form onsubmit="event.preventDefault();">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">ID Factura <span class="required">*</span></label>
                        <input type="text" class="form-control" value="" name="id-invoice" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label"># Factura<span class="required">*</span></label>
                        <input type="text" class="form-control" value="" name="number-invoice" id="number-invoice"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tipo de Pago</label>
                        <input type="text" class="form-control" value="" name="type-invoice" id="type-invoice"" required>
                    </div>

                    <div class=" form-group">
                        <label class="form-label">Fecha Factura</label>
                        <input type="text" class="form-control" value="" name="date-invoice" id="date-invoice" required>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label ">Proveedor <span class="required">*</span></label>
                        <input type="text" class="form-control" placeholder="Buscar o ingresar cliente..." value=""
                            id="name-supplier">
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary">Consultar</button>
                    <button type="submit" class="btn btn-primary">Guardar Registro</button>
                </div>
            </form>

        </div>
        <div class="card-table">
            <div class="card-title">Items Factura Compra</div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 160px;">Id</th>
                            <th style="width: 140px;">Codigo</th>
                            <th style="width: 200px;">Descripcion</th>
                            <th style="width: 180px;">Marca</th>
                            <th style="width: 180px;">Grupo</th>
                            <th style="width: 180px;">Tipo</th>
                            <th style="width: 80px;">Cant</th>
                            <th style="width: 80px;">Costo</th>
                            <th style="width: 80px;">Val 1</th>
                            <th style="width: 80px;">Val 2</th>
                            <th style="width: 80px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="body-table-items">

                    </tbody>
                </table>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-secondary">Imprimir</button>
                <button type="submit" class="btn btn-primary">Guardar Registros</button>
            </div>
        </div>
    </div>
</section>

<div id="editModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Editar Registro</div>
            <button class="modal-close" onclick="closeModal()" title="Cerrar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <form onsubmit="saveModalData(event)">
            <div class="modal-body">
                <div class="form-grid" style="grid-template-columns: 1fr; gap: 14px; margin-bottom: 0;">
                    <div class="form-group">
                        <label class="form-label">Id</label>
                        <input type="text" id="modalId" class="form-control" readonly
                            style="background-color: var(--bg-subtle);">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Código</label>
                        <input type="text" id="modalCode" class="form-control"
                            style="background-color: var(--bg-subtle);">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descripción<span class="required">*</span></label>
                        <input type="text" id="modalDescripcion" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Marca<span class="required">*</span></label>
                        <input type="text" id="modalMarca" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Grupo<span class="required">*</span></label>
                        <input type="text" id="modalGrupo" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo<span class="required">*</span></label>
                        <input type="text" id="modalTipo" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cantidad <span class="required">*</span></label>
                        <input type="number" id="modalCant" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Costo ($) <span class="required">*</span></label>
                        <input type="number" id="modalCosto" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Valor 1 ($) <span class="required">*</span></label>
                        <input type="number" id="modalValor1" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Valor 2 ($) <span class="required">*</span></label>
                        <input type="number" id="modalValor2" class="form-control" required>
                    </div>

                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn btn-secondary" form="formSearchItems">Consultar</button>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
        <form action="{{ url_for('get_items') }}" method="post" id="formSearchItems"></form>
    </div>
</div>




<script>
    const uploadForm = document.getElementById('invoice-upload-form');
    const uploadStatus = document.getElementById('upload-status');
    const searchItems = document.getElementById('formSearchItems');

    uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const submitButton = uploadForm.querySelector('button[type="submit"]');
        const formData = new FormData(uploadForm);

        submitButton.disabled = true;
        uploadStatus.textContent = 'Procesando factura...';

        try {
            const response = await fetch(uploadForm.action, {
                method: 'POST',
                body: formData,
            });
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.details || result.error || 'No se pudo cargar la factura.');
            }
            uploadStatus.textContent = `Factura procesada: ${result.filename}`;
            processInvoiceData(result.data);
            uploadForm.reset();
        } catch (error) {
            uploadStatus.textContent = `Error: ${error.message}`;
        } finally {
            submitButton.disabled = false;
        }
    });

    searchItems.addEventListener('submit', async (event) => {
        event.preventDefault();

        const submitButton = searchItems.querySelector('button[type="submit"]');
        //submitButton.disabled = true;

        const code = document.getElementById('modalCode').value
        const route = `${searchItems.action}/${code}`
        const formData = new FormData()

        try {
            const request = await fetch(route, {
                method: 'post',
                body: formData
            })

            const result = await request.json();
            const statusCode = await request.status;

            if (statusCode === 200 && result.data.length == 1) {
                editModal(result.data)
            }
            
        } catch (error) {
            console.log(error)
        }

    })
    function processInvoiceData(data) {

        if ("data_invoice" in data) {
            const dataInvoice = data["data_invoice"];
            const itemsInvoice = data["items"];
            const factura = dataInvoice["factura"];
            const proveedor = dataInvoice["proveedor"];
            const totales = dataInvoice["totales"];

            const nameSupplier = document.getElementById("name-supplier");
            const dateInvoice = document.getElementById("date-invoice");
            const numberInvoice = document.getElementById("number-invoice");
            const tableItems = document.getElementById("body-table-items");

            numberInvoice.value = factura["numero_factura"];
            dateInvoice.value = factura["fecha_emision"];
            nameSupplier.value = proveedor["nombre"];

            itemsInvoice.forEach(element => {
                row = document.createElement("tr");
                row.classList.add("data-row");

                colId = document.createElement("td");
                colCodigo = document.createElement("td");
                colDescripcion = document.createElement("td");
                colMarca = document.createElement("td");
                colGrupo = document.createElement("td");
                colTipo = document.createElement("td");
                colCant = document.createElement("td");
                colVal1 = document.createElement("td");
                colVal2 = document.createElement("td");
                colCosto = document.createElement("td");
                colAction = document.createElement("td");
                colCant.style.textAlign = "right";
                colCosto.style.textAlign = "right";
                colVal1.style.textAlign = "right";
                colVal2.style.textAlign = "right";
                colAction.innerHTML = `<button class="btn-edit-table" onclick="openEditModal('${element.codigo}', '${element.descripcion}', '${element.cantidad}', '${element.precio_unitario}', this)">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                                        <span>Editar</span>
                                    </button>`

                colCodigo.textContent = element.codigo
                colDescripcion.textContent = element.descripcion
                colCant.textContent = element.cantidad
                colCosto.textContent = element.precio_unitario
                colGrupo.textContent = ""
                colTipo.textContent = ""

                row.appendChild(colId);
                row.appendChild(colCodigo);
                row.appendChild(colDescripcion);
                row.appendChild(colMarca);
                row.appendChild(colGrupo);
                row.appendChild(colTipo);
                row.appendChild(colCant);
                row.appendChild(colCosto);
                row.appendChild(colVal1);
                row.appendChild(colVal2);
                row.appendChild(colAction);

                tableItems.appendChild(row)
            });
            // console.log('Datos extraídos de la factura:', dataInvoice);

        }
    }

    function openEditModal(code, descripcion, cant, costo, button) {

        document.getElementById('modalCode').value = code;
        document.getElementById('modalDescripcion').value = descripcion;
        document.getElementById('modalMarca').value = "";
        document.getElementById('modalGrupo').value = "";
        document.getElementById('modalTipo').value = "";
        document.getElementById('modalCant').value = cant;
        document.getElementById('modalCosto').value = costo;
        document.getElementById('modalValor1').value = 0;
        document.getElementById('modalValor2').value = 0;
        document.getElementById('modalTitle').innerText = 'Editar Venta (' + code + ')';

        if (button) {
            activeRowElement = button.parentElement.parentElement
        }
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
        if (e.target.id === 'editModal') {
            closeModal();
        }
    }

    function saveModalData(e) {
        e.preventDefault();

        const id = document.getElementById('modalId').value;
        const code = document.getElementById('modalCode').value;
        const descripcion = document.getElementById('modalDescripcion').value;
        const marca = document.getElementById('modalMarca').value;
        const grupo = document.getElementById('modalGrupo').value;
        const tipo = document.getElementById('modalTipo').value;
        const cant = parseFloat(document.getElementById('modalCant').value) || 0;
        const costo = parseFloat(document.getElementById('modalCosto').value) || 0;
        const valor1 = parseFloat(document.getElementById('modalValor1').value) || 0;
        const valor2 = parseFloat(document.getElementById('modalValor2').value) || 0;

        if (activeRowElement) {
            const cells = activeRowElement.querySelectorAll('td');
            if (cells.length >= 4) {
                cells[0].innerText = id;
                cells[1].innerText = code;
                cells[2].innerText = descripcion;
                cells[3].innerText = marca;
                cells[4].innerText = grupo;
                cells[5].innerText = tipo;
                cells[6].innerText = cant;
                cells[7].innerText = costo;
                cells[8].innerText = valor1;
                cells[9].innerText = valor2;
            }
        }

        closeModal();
    }

    function editModal(data) {
        const code = data[0].Codigo;
        const descripcion = data[0].Descripcion;
        const costo = data[0].Costo;
        const id = data[0].Id;
        const marca = data[0].Marca;
        const grupo = data[0].Grupo_Uno;
        const grupo2 = data[0].Grupo_Dos;
        const valor1 = data[0].Valor_Min;
        const valor2 = data[0].Valor_Max;
        const referencia = data[0].Referencia;

        document.getElementById('modalId').value = id;
        document.getElementById('modalCode').value = code;
        document.getElementById('modalDescripcion').value = descripcion;
        document.getElementById('modalMarca').value = marca;
        document.getElementById('modalGrupo').value = grupo;
        document.getElementById('modalTipo').value = grupo2;
        //document.getElementById('modalCant').value = cant;
        document.getElementById('modalCosto').value = costo;
        document.getElementById('modalValor1').value = valor1;
        document.getElementById('modalValor2').value = valor2;
        /*
                {
            "Ajustes": "0",
            "Cant_Compras": "0",
            "Cant_Devolucion": "0",
            "Cant_Ventas": "7",
            "Codigo": "203161",
            "Costo": "1000",
            "Cuenta": "143501",
            "D_Ticket": "ABRAZADERA 13/32 - 5/08",
            "Descripcion": "ABRAZADERA 13/32 - 5/08",
            "Existencias": "-7",
            "Grupo_Dos": "",
            "Grupo_Uno": "",
            "Icon": "",
            "Id": "58c83aa3",
            "Iva": "0.19",
            "Marca": "TITAN",
            "Max": "0",
            "Min": "0",
            "Puesto": "",
            "Referencia": "203161",
            "Related Ajustes_Inventarios": "",
            "Related Referencias_Compras": "",
            "Related Referencias_Devolucions By Fk_Referencia": "",
            "Related Referencias_Ventas": "75688378 , 6d7ed4cc , 850f72c4 , 04919f10 , 4463f553",
            "Valor_Max": "3000",
            "Valor_Min": "2000",
            "Vehiculo": "",
            "_RowNumber": "3"
        }*/
    }

    function searchCodeInTable(code) {
        const table = document.querySelector('.data-table');
        const rows = table.querySelectorAll('tbody tr');

        for (const row of rows) {
            const codeCell = row.cells[1]; // Assuming the code is in the second column (index 1)
            if (codeCell && codeCell.textContent.trim() === code) {
                return row; // Return the matching row
            }
        }
        return null; // Return null if not found
    }

</script>
{% endblock %}
