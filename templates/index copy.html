<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ticket App IA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block stylesheets %}{% endblock %}
    {% block scripts %}{% endblock %}
</head>
<body>
    <header class="header">
        <svg class="menu-bottom" focusable="false" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path></svg>
        <p>Ticket App IA</p>
        <img src="{{ url_for('static', filename='img/favicon.png') }}" alt="Icon">
       
    </header>
    <nav class="left-sidebar">
        <ul>
            <li><a href="/">Inicio</a></li>
            <li><a href="/invoice">Factura</a></li>
            <li><a href="/tickets/forms">Ticket</a></li>
        </ul>
    </nav>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <aside class="right-sidebar">
    </aside>
    <footer class="footer">
        <p>Developed by rocket developer | 2025 © </p><span>v 1.2</span>
    </footer>
</body>
</html>
